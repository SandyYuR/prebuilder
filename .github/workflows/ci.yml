name: CI

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [librime-only, everything]
        default: librime-only

permissions:
  contents: write
  actions: read

concurrency:
  group: prebuilder-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.target == 'everything'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ABI: "armeabi-v7a,arm64-v8a,x86,x86_64"
      NDK_VERSION: "28.0.13004108"
      CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM: "23"
      RUST_VERSION: "1.92.0"

    steps:
      - name: Install build dependencies
        # android-actions/setup-android needs unzip
        # sdkmanager needs jre
        # libime needs boost (build host tools)
        # opencc needs python (scripts)
        # libchewing needs rustup (build)
        # libiconv needs gperf (build)
        run: |
          pacman -Syu --needed --noconfirm \
            git unzip jre-openjdk \
            ghc cabal-install haskell-shake haskell-aeson-pretty \
            cmake extra-cmake-modules ninja \
            fmt boost boost-libs \
            python opencc \
            rustup \
            gperf github-cli jq

      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          # this only sync submodules specified in .gitmodules,
          # because we don't want recursive submodules in glog, librime, etc.
          submodules: true
          fetch-depth: 0

      - name: Fetch submodules
        run: |
          # it appears to be a bug when building in containers: https://github.com/actions/checkout/issues/915
          git config --global --add safe.directory '*'
          # fetch libime submodule kenlm since it's not in .gitmodules
          git submodule update --init --recursive libime
          # fetch tags for version derivation
          git -C librime fetch -v --tags origin
          # Plugins stay at their recorded gitlinks, including predict.
          # fetch libchewing-data submodule
          git submodule update --init --recursive libchewing

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }}"

      - name: Build everything
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
        run: |
          # use archlinux's dynamic only ghc
          cabal configure --disable-library-vanilla --enable-shared --enable-executable-dynamic --ghc-options=-dynamic
          ./build-cabal -j everything

      - name: Pack prebuilt libraries
        if: github.event_name == 'pull_request'
        run: |
          cd build
          mkdir prebuilt
          for TARGET in $(<artifacts.txt)
          do
            cp -a "$TARGET" prebuilt/
          done
          tar --zstd -cf prebuilt.tar.zst prebuilt/

      - name: Upload prebuilt to artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: build/prebuilt.tar.zst
          archive: false

      - name: Fetch SandyYuR/prebuilt
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/checkout@v6
        with:
          path: prebuilt
          repository: SandyYuR/prebuilt
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Push to SandyYuR/prebuilt
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        working-directory: prebuilt
        run: |
          rm -r ./*
          for TARGET in $(<../build/artifacts.txt)
          do
            cp -a "../build/$TARGET" ./
          done
          git config user.name "Fcitx5 Android Bot"
          git config user.email "102923727+fcitx5-android-bot@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto update"
          git push --set-upstream origin "HEAD:master" --follow-tags --atomic

      - name: Detect librime related changes
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        id: detect_rime_changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$BASE_SHA" ]; then
            CHANGED_PATHS=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- librime librime-predict-leveldb)
          else
            CHANGED_PATHS=$(git show --name-only --pretty="" "$GITHUB_SHA" -- librime librime-predict-leveldb)
          fi
          HAS_LIBRIME=false
          HAS_PREDICT=false
          if echo "$CHANGED_PATHS" | grep -q '^librime$'; then
            HAS_LIBRIME=true
          fi
          if echo "$CHANGED_PATHS" | grep -q '^librime-predict-leveldb$'; then
            HAS_PREDICT=true
          fi
          if [ "$HAS_LIBRIME" = "true" ] || [ "$HAS_PREDICT" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "has_librime=$HAS_LIBRIME" >> "$GITHUB_OUTPUT"
          echo "has_predict=$HAS_PREDICT" >> "$GITHUB_OUTPUT"


  librime_update:
    if: inputs.target != 'everything'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch pinned engine and plugin sources
        run: git submodule update --init --depth 1 librime librime-lua librime-octagram librime-predict-leveldb
      - uses: actions/checkout@v6
        with:
          repository: SandyYuR/prebuilt
          ref: 1126616c3ec569617da772e30d7a97f6b2694172
          path: native-deps
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.0.13004108 cmake;3.31.6'
      - name: Rebuild the pinned engine against the existing dependencies
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
          CMAKE_BIN: ${{ env.ANDROID_HOME }}/cmake/3.31.6/bin/cmake
        run: bash scripts/build-librime-only.sh '${{ matrix.abi }}' native-deps 'build/librime-${{ matrix.abi }}'
      - uses: actions/upload-artifact@v7
        with:
          name: librime-${{ matrix.abi }}
          path: build/librime-${{ matrix.abi }}/product/

  librime_host_tests:
    if: inputs.target != 'everything'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git submodule update --init --depth 1 librime
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev libgoogle-glog-dev libyaml-cpp-dev libleveldb-dev libmarisa-dev libopencc-dev libgtest-dev
      - name: Validate source provenance and prepare the committed engine
        run: |
          python3 scripts/test-librime-source.py
          python3 scripts/prepare-librime.py build/host-source --without-plugins
      - name: Build and run upstream and downstream engine tests
        run: |
          cmake -S build/host-source/librime -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON -DBUILD_TOOLS=OFF
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: librime-host-test-results
          path: |
            build/host/Testing/
            build/host-source/source-manifest.json
